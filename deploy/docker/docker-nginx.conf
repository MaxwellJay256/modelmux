server {
    listen 4412;
    client_max_body_size 16m;
    proxy_buffering off;
    proxy_read_timeout 600s;
    proxy_http_version 1.1;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway gateway:4412;

    # 仅公开明确的模型及健康接口；其他路径（含 /web）一律拒绝。
    location ~ ^/(health|v1/models|v1/chat/completions|v1/messages|v1/messages/count_tokens|v1/responses)$ {
        proxy_pass http://$gateway$request_uri;
    }
    location / {
        return 404;
    }
}
