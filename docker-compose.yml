name: modelmux
services:
  gateway:
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:22-bookworm-slim}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    image: modelmux:${MODELMUX_TAG:-local}
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    command: ["serve", "--addr", "0.0.0.0:4412"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - modelmux-data:/data
      - modelmux-keyring:/keyring
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
    logging: &logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # 只转发模型接口，绝不把控制台代理成网关的本机请求。
  modelmux:
    image: ${PROXY_IMAGE:-nginxinc/nginx-unprivileged:stable}
    init: true
    restart: unless-stopped
    depends_on:
      gateway:
        condition: service_healthy
    ports:
      - "${MODELMUX_BIND:-127.0.0.1}:${MODELMUX_PORT:-4412}:4412"
    volumes:
      - ./docker-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    security_opt:
      - no-new-privileges:true
    networks:
      - backend
      - modelmux-net
    logging: *logging

networks:
  backend:
  # 与其他 Compose 项目共享；首次使用前创建 docker network create modelmux-net。
  modelmux-net:
    external: true
    name: modelmux-net

volumes:
  modelmux-data:
    name: modelmux-data
  modelmux-keyring:
    name: modelmux-keyring
